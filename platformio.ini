; PlatformIO Project Configuration File
;
; Two firmwares share this project, one Teensy 4.0 each:
;   pio run -e actuator -t upload   -> src/actuator.cpp
;   pio run -e encoder  -t upload   -> src/encoder.cpp
; Plain `pio run -t upload` flashes the default env (actuator).

[platformio]
default_envs = actuator

[env]
platform = teensy
board = teensy40
framework = arduino

[env:actuator]
build_src_filter = -<*> +<actuator.cpp>

[env:encoder]
build_src_filter = -<*> +<encoder.cpp>

; Board test: blinks the on-board LED.  pio run -e blink -t upload
[env:blink]
build_src_filter = -<*> +<blink.cpp>
